services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ota
      MYSQL_DATABASE: ota
      MYSQL_USER: ota
      MYSQL_PASSWORD: ota
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # Creates the separate test database on first start.
      - ./api/docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uota", "-pota"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
